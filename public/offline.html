<!doctype html>
<html lang="af">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geen internet · No internet · Leesavontuur</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d6ecf8; color: #1d2b36; font-family: Verdana, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
      main { background: #fff; border-radius: 22px; padding: 28px; max-width: 460px; text-align: center; }
      h1 { color: #2e6b3f; font-size: 26px; margin: 12px 0 8px; }
      p { line-height: 1.5; margin: 0 0 10px; }
      button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; background: #2e6b3f; color: #fff; padding: 12px 22px; margin-top: 10px; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #10202b; color: #eaf2f7; } main { background: #182a36; } h1 { color: #76c68b; } button { background: #76c68b; color: #10202b; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="96" height="96" alt="" />
      <h1 lang="af">Geen internet nie</h1>
      <p lang="af">Leesavontuur het internet nodig. Kyk of jou Wi-Fi of data aan is, en probeer weer.</p>
      <h1 lang="en">No internet</h1>
      <p lang="en">Leesavontuur needs the internet. Check that your Wi-Fi or data is on, and try again.</p>
      <button type="button" onclick="location.reload()">Probeer weer · Try again</button>
    </main>
  </body>
</html>
